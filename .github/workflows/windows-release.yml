name: Windows EXE ve gerçek Chatterbox doğrulaması
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  windows-production:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - name: Bağımlılıklar
        run: npm ci
      - name: Electron runtime doğrulaması
        run: node scripts/ensure-electron.mjs
      - name: Statik kontroller ve standart testler
        env:
          NEDENMIS_ANIMATION_RESULT: ${{ github.workspace }}\release\animation-test-result.json
          NEDENMIS_ANIMATION_OUTPUT: ${{ github.workspace }}\release\Why-does-ice-float-on-water.mp4
        run: |
          npm run typecheck
          npm run lint
          python -m unittest discover -s voice-engine -p "test_*.py"
          npm run test
      - name: Üretim derlemesi
        run: npm run build
      - name: Geliştirme Electron açılışı
        shell: cmd
        run: |
          if not exist release mkdir release
          node scripts/electron-smoke.mjs --dev > release\dev-electron-smoke.log 2>&1
          set CODE=%ERRORLEVEL%
          type release\dev-electron-smoke.log
          exit /b %CODE%
      - name: Üretim Electron açılışı
        shell: cmd
        run: |
          node scripts/electron-smoke.mjs > release\production-electron-smoke.log 2>&1
          set CODE=%ERRORLEVEL%
          type release\production-electron-smoke.log
          exit /b %CODE%
      - name: Gerçek sentetik konuşmacı referansı
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\nedenmis-chatterbox" | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/fixtures/create_reference.ps1 -OutputPath "$env:RUNNER_TEMP\nedenmis-chatterbox\sapi-reference.wav"
      - name: Resmî Türkçe V3 referansını test ortamına al
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/tr_m.flac" -OutFile "$env:RUNNER_TEMP\nedenmis-chatterbox\turkish-reference.flac"
          if ((Get-Item "$env:RUNNER_TEMP\nedenmis-chatterbox\turkish-reference.flac").Length -lt 10000) { throw 'Türkçe referans indirilemedi.' }
      - name: Gerçek Chatterbox V3 Türkçe klonlama ve video testi
        env:
          NEDENMIS_CHATTERBOX_E2E: '1'
          NEDENMIS_CHATTERBOX_SETUP: '1'
          NEDENMIS_CHATTERBOX_STORAGE: ${{ runner.temp }}\nedenmis-chatterbox\storage
          NEDENMIS_CHATTERBOX_REFERENCE: ${{ runner.temp }}\nedenmis-chatterbox\sapi-reference.wav
          NEDENMIS_CHATTERBOX_TURKISH_REFERENCE: ${{ runner.temp }}\nedenmis-chatterbox\turkish-reference.flac
          NEDENMIS_CHATTERBOX_RESULT: ${{ github.workspace }}\release\chatterbox-test-result.json
          NEDENMIS_TURKISH_QUALITY_MANIFEST: ${{ github.workspace }}\release\turkish-quality-manifest.json
        shell: cmd
        run: |
          npm run test:chatterbox > release\chatterbox-e2e.log 2>&1
          set CODE=%ERRORLEVEL%
          type release\chatterbox-e2e.log
          exit /b %CODE%
      - name: Bağımsız Türkçe ASR anlaşılırlık kapısı
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\voice-engine\runtime\python.exe"
          & $python -m pip install --only-binary=:all: faster-whisper==1.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python voice-engine/quality_check.py --manifest release/turkish-quality-manifest.json --output release/turkish-quality-source-result.json
          exit $LASTEXITCODE
      - name: Windows x64 NSIS kurucusu
        run: npm run dist:win
      - name: Taşınabilir ZIP
        run: node scripts/package-portable.mjs
      - name: Kur, terminalsiz aç ve SQLite doğrula
        shell: pwsh
        run: ./scripts/test-installer.ps1 -SetupPath ./release/NedenmisStudio-Setup.exe -VoiceTestRoot "$env:RUNNER_TEMP\nedenmis-chatterbox"
      - name: Kurulu uygulama WAV/MP4 kanıtlarını topla
        shell: pwsh
        run: |
          $installed = Get-Content release/installer-test-result.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force release/Kurulu-Uygulama-Testi | Out-Null
          Copy-Item $installed.installedVoice.audioPath release/Kurulu-Uygulama-Testi/installed-turkish.wav -Force
          Copy-Item $installed.installedExport.outputPath release/Kurulu-Uygulama-Testi/installed-four-scenes.mp4 -Force
          $manifest = Get-Content release/turkish-quality-manifest.json -Raw | ConvertFrom-Json
          $manifest.cases += [pscustomobject]@{ id='installed-app-turkish'; audio=$installed.installedVoice.audioPath; text='Kurulu Nedenmiş Studio uygulaması, gerçek referans sesle Türkçe konuşma üretiyor.'; required=$true }
          $manifest.cases += [pscustomobject]@{ id='installed-app-four-scene-mp4'; audio=$installed.installedExport.outputPath; text='Sıvı suda moleküller sürekli titreşir ve birbirinin yanından geçer. Su donarken molekülleri düzenli bir kristal yapı oluşturur. Bu açık kristal kafes daha fazla yer kaplar ve buzun yoğunluğunu düşürür. Buzun suda yüzmesinin nedeni yoğunluğunun sudan daha düşük olmasıdır.'; required=$true }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content release/turkish-quality-manifest.json -Encoding UTF8
          $python = "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\voice-engine\runtime\python.exe"
          & $python voice-engine/quality_check.py --manifest release/turkish-quality-manifest.json --output release/turkish-quality-result.json
          exit $LASTEXITCODE
      - name: Kurulum boyutları ve SHA-256 manifesti
        shell: pwsh
        run: |
          $files = @('release/NedenmisStudio-Setup.exe', 'release/NedenmisStudio-Portable.zip') | ForEach-Object {
            $item = Get-Item $_
            [pscustomobject]@{ name=$item.Name; bytes=$item.Length; sha256=(Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [pscustomobject]@{ version='1.1.0'; build=[int]$env:GITHUB_RUN_NUMBER; commit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; files=$files; testedOn='windows-latest'; humanListeningPerformed=$false } | ConvertTo-Json -Depth 5 | Set-Content release/build-manifest.json -Encoding UTF8
      - name: Başarısızlık loglarını CI annotation’a yaz
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $sections = @()
          Get-ChildItem release -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            $raw = [IO.File]::ReadAllText($_.FullName).Replace("`r", "`n")
            $clean = [regex]::Replace($raw, '\x1B\[[0-9;]*[A-Za-z]', '')
            $tail = (($clean -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 70) -join "`n")
            $escaped = $tail.Replace('%', '%25').Replace("`n", '%0A')
            Write-Host "::error::$($_.Name)%0A$escaped"
            $sections += "## $($_.Name)`n``````text`n$tail`n``````"
          }
          if ($sections.Count) {
            [IO.File]::WriteAllText("$PWD/release/failure-summary.md", "CI $($env:GITHUB_RUN_ID) teknik hata özeti`n`n$($sections -join "`n`n")")
            if ($env:PR_NUMBER) { gh pr comment $env:PR_NUMBER --body-file release/failure-summary.md }
          }
      - name: Test ve ses/video kanıtlarını paketle
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (Test-Path "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\previews") { Copy-Item "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\previews" -Destination release -Recurse -Force }
          if (Test-Path "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\exports") { Copy-Item "$env:RUNNER_TEMP\nedenmis-chatterbox\storage\exports" -Destination release -Recurse -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NedenmisStudio-Windows-Test-Kanitlari
          path: |
            release/*.json
            release/*.log
            release/*.mp4
            release/previews/**
            release/exports/**
            release/Kurulu-Uygulama-Testi/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: NedenmisStudio-Windows-x64
          path: |
            release/NedenmisStudio-Setup.exe
            release/NedenmisStudio-Portable.zip
            release/installer-test-result.json
            release/chatterbox-test-result.json
            release/turkish-quality-result.json
            release/turkish-quality-source-result.json
            release/build-manifest.json
          if-no-files-found: error
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v1.1.0-build$($env:GITHUB_RUN_NUMBER)"
          $assets = @('release/NedenmisStudio-Setup.exe', 'release/NedenmisStudio-Portable.zip', 'release/installer-test-result.json', 'release/chatterbox-test-result.json', 'release/turkish-quality-result.json', 'release/turkish-quality-source-result.json', 'release/build-manifest.json')
          $assets += Get-ChildItem release/Kurulu-Uygulama-Testi -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem release/exports -Filter *.mp4 -File | ForEach-Object { $_.FullName }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Nedenmiş Studio 1.1.0 · Windows x64 · Build $env:GITHUB_RUN_NUMBER" --notes "Gerçek Chatterbox Multilingual V3, V3 NFKD/fullcase ön işlemesi ve gerçek Türkçe referansla A/B sınandı. Dört sahneli Buz neden suda yüzer? projesi, gerçek nesne animasyonu, 1080x1920/30 FPS MP4, altyazı, SQLite, kurulu uygulama önizlemesi/export ve bağımsız Türkçe ASR kalite kapıları başarılı olmadan bu adım çalışmaz. ASR anlaşılırlık kanıtıdır; insan dinlemesi veya doğal prozodi iddiası değildir. Model birkaç GB olduğu için ilk kullanımda Ses Stüdyosu'ndan indirilir."
